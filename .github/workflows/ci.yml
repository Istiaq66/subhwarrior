name: Flutter CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Manual release to a chosen Play track (Actions tab → Run workflow).
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

# Cancel superseded runs on the same ref. A cancelled upload is safe: Play
# discards an edit that was never committed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'
  # Play versionCode = offset + run number, so every upload is unique and
  # increasing. Kept well above pubspec's build number (the first, manual
  # upload uses that). Never lower it once builds have been uploaded.
  VERSION_CODE_OFFSET: 1000

jobs:
  # Fast quality gate — runs on every push/PR, no signing required.
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Errors/warnings block; infos are tracked tech debt (withOpacity →
      # IMPROVEMENT_PLAN C5). Drop --no-fatal-infos once C5 lands.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test --coverage

  # Signed App Bundle → Google Play. Pushes to master go to the internal
  # testing track; a manual run can target any track. Promote to production
  # from Play Console (or a manual run) once a build has been tested.
  build_and_deploy:
    name: Build AAB & Deploy to Google Play
    needs: analyze_and_test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Lifted to job env so steps can gate on it — the `secrets` context is
    # not allowed directly inside a step-level `if:`.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_TRACK: ${{ inputs.track || 'internal' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 21 matches the Gradle / build.gradle.kts toolchain settings.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # build.gradle.kts silently falls back to debug signing without
      # key.properties. Play rejects that, so fail loudly instead.
      - name: Require Release Signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to build an unsigned release."
          exit 1

      - name: Configure Release Signing
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Compute Version Code
        run: echo "VERSION_CODE=$(( VERSION_CODE_OFFSET + ${{ github.run_number }} ))" >> "$GITHUB_ENV"

      # versionName still comes from pubspec.yaml; only the code is overridden.
      - name: Build App Bundle (release)
        run: flutter build appbundle --release --build-number="$VERSION_CODE"

      - name: Upload AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subhwarrior-release-aab-${{ env.VERSION_CODE }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 14

      # Skipped until the service-account secret exists, so CI stays green
      # while Play access is being set up.
      - name: Deploy to Google Play
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.subhwarrior.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          # Set the repo variable PLAY_RELEASE_STATUS to "draft" while the app
          # itself is still a draft in Play Console (never published).
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: distribution/whatsnew
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Note Skipped Deploy
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; built and kept the AAB as an artifact but did not upload it to Google Play."
